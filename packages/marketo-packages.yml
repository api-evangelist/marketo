method: searched
source: >-
  https://github.com/Marketo/Community-Supported-Client-Libraries (Marketo's own
  client-library index), the Marketo GitHub org, and unauthenticated registry
  metadata endpoints (registry.npmjs.org, pypi.org, rubygems.org,
  repo.packagist.org, proxy.golang.org, search.maven.org, api.github.com).
note: >-
  Marketo publishes almost no first-party REST client libraries. Its own index
  page is titled "Community Supported Client Libraries" and states plainly that
  "these client libraries have not been security tested by Marketo"; only two
  entries appear under its "Official Libraries" heading, and both target the
  SOAP API that Adobe deprecated on 2026-07-31. The only first-party libraries
  with live registry metadata are the Marketo Mobile Engagement SDKs (iOS /
  Android), which are mobile-engagement SDKs, not REST API clients. Every
  package below carries a structured `version` + `published` read from the
  registry, because the decay is the finding: the newest first-party REST-era
  artifact in this list is a 2015 Maven plugin.
official_sdk_count: 4
