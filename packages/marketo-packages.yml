findings:
  - >-
    Marketo names only two "Official Libraries", both for the SOAP API Adobe
    deprecated on 2026-07-31. There is no first-party REST client library in any
    registry.
  - >-
    The two first-party SDKs with live registry metadata (MarketoSDK 0.8.13,
    2024-08-14; ios-sdk 0.8.6, 2024-04-23) are Mobile Engagement SDKs and do not
    wrap the REST API this profile describes.
  - >-
    Marketo's published client-library index still links repositories that were
    never released to a registry under the linked name (usermindinc/node-marketo),
    and four of its fourteen community entries target the retired SOAP API.
