summary:
  conforms: 6
  partial: 3
  does_not_conform: 14
  strongest: RFC 9116 security.txt, documented OAuth 2.0, published webhooks, consistent pagination.
  weakest: >-
    HTTP semantics. Returning 200 for auth failure, rate-limit exhaustion and
    per-record failure is the single largest agent-readiness liability on this
    API — an agent that trusts status codes will silently treat failures as
    successes.
