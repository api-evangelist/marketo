    conforms: true
    evidence: >-
      OAuth 2.0 two-legged client-credentials grant documented at
      /rest/authentication; token endpoint /identity/oauth/token returns
      access_token, token_type=bearer, expires_in, scope.
    caveat: >-
      No securitySchemes are declared in ANY published spec, so conformance is
      documented, not machine-readable.
  - id: rfc6750-bearer-token
    conforms: true
    evidence: 'Authorization: Bearer <access_token> is the mandated transport from 2026-08-31.'
  - id: rfc6749-scopes
    conforms: false
    evidence: >-
      No scope request parameter and no scope vocabulary. The `scope` response
