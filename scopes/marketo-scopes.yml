model: role-permissions
note: >-
  Marketo Engage has NO OAuth scope vocabulary. Its OAuth 2.0 client-credentials
  flow takes no `scope` request parameter, and the `scope` member of the token
  response carries the API-Only user's email address, not a permission grant.
  Authorization is instead expressed as role permissions under the "Access API"
  tree, assigned to the API-Only user that owns the LaunchPoint Custom Service
  the credentials belong to. This file records that permission vocabulary in the
  scopes/ slot because it is the artifact an agent needs in order to know what a
  given credential may do. 0-working/derive-oauth-scopes.py returns zero for this
  provider because Adobe's published specs declare no securitySchemes at all.
schemes:
  - name: MarketoOAuth2ClientCredentials
    type: oauth2
    flow: clientCredentials
    tokenUrl: https://{munchkinId}.mktorest.com/identity/oauth/token
    scopes_declared: 0
    source: docs
authorization:
  unit: role permission
  assignment: >-
    Permissions are granted to a role (Admin > Users & Roles > Roles), the role
    is assigned to an API-Only user, and a LaunchPoint Custom Service scoped to
    that user issues the Client Id / Client Secret. Only permissions in the
    "Access API" group apply to API users — assigning all admin permissions does
    NOT grant API permissions.
  workspace_scoping: >-
    In subscriptions with Workspaces and Partitions enabled, permissions are
    assigned per workspace. A user who can read or write lead records in a
    workspace can reach every record in the partitions that workspace can see.
  guidance: >-
    Adobe's own advice is least privilege — "assign only the minimum permissions
    required" — and a separate API-Only user per integration, because API call
    usage and errors are tracked per user.
