openapi: 3.2.0
info:
  description: Marketo Engage Rest API
  version: '1.0'
  title: Marketo Engage Rest Folders API
  termsOfService: https://www.adobe.com/legal.html
  contact:
    name: Adobe Developer Relations
    url: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/home
    email: ''
  license:
    name: API License Agreement
    url: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/api-license
servers:
- url: https://localhost:8080/
tags:
- name: Folders
  description: Folder Controller
paths:
  /rest/asset/v1/folder/byName.json:
    get:
      tags:
      - Folders
      summary: Get Folder by Name
      description: 'Returns a folder record for the given name. Required Permissions: Read-Only Assets, Read-Write Assets'
      operationId: getFolderByNameUsingGET
      parameters:
      - name: name
        in: query
        description: Name of the folder. Not applicable for Programs
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: Type of folder. 'Folder' or 'Program'
        required: false
        schema:
          type: string
      - name: root
        in: query
        description: Parent folder reference
        required: false
        schema:
          type: string
      - name: workSpace
        in: query
        description: Name of the workspace
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseOfFolderResponse'
  /rest/asset/v1/folder/{id}.json:
    get:
      tags:
      - Folders
      summary: Get Folder by Id
      description: 'Returns the folder record with the given id. Required Permissions: Read-Only Assets, Read-Write Assets'
      operationId: getFolderByIdUsingGET
      parameters:
      - name: id
        in: path
        description: Id of the folder to retrieve
        required: true
        schema:
          type: integer
          format: int32
      - name: type
        in: query
        description: Type of folder. 'Folder' or 'Program'
        required: true
        schema:
          type: string
          enum:
          - Folder
          - Program
          default: Folder
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseOfFolderResponse'
    post:
      tags:
      - Folders
      summary: Update Folder Metadata
      description: 'Updates the metadata for a given folder. Required Permissions: Read-Write Assets'
      operationId: updateFolderUsingPOST
      parameters:
      - name: id
        in: path
        description: Id of the folder to update
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseOfFolderResponse'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateFolderRequest'
        description: updateFolderRequest
        required: true
  /rest/asset/v1/folder/{id}/content.json:
    get:
      tags:
      - Folders
      summary: Get Folder Contents
      description: 'Returns records for the contents of a given folder. Required Permissions: Read-Only Assets, Read-Write Assets'
      operationId: getFolderContentUsingGET
      parameters:
      - name: id
        in: path
        description: Id of the folder to retrieve
        required: true
        schema:
          type: integer
          format: int32
      - name: maxReturn
        in: query
        description: Maximum number of records to return. Max 200, default 20
        required: false
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        description: Integer offset for paging
        required: false
        schema:
          type: integer
          format: int32
      - name: type
        in: query
        description: Type of folder. 'Folder' or 'Program'. Default is 'Folder'
        required: true
        schema:
          type: string
          enum:
          - Folder
          - Program
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseOfFolderContentResponse'
  /rest/asset/v1/folder/{id}/delete.json:
    post:
      tags:
      - Folders
      summary: Delete Folder
      description: 'Deletes the designated folder. Deletion will fail if the folder has content. Required Permissions: Read-Write Assets'
      operationId: deleteFolderUsingPOST
      parameters:
      - name: id
        in: path
        description: Id of the folder to delete
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseOfIdResponse'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - Program
                  - Folder
                  default: Folder
                  description: type
              required:
              - type
  /rest/asset/v1/folders.json:
    get:
      tags:
      - Folders
      summary: Get Folders
      description: 'Retrieves child folders from within a given root folder. Required Permissions: Read-Only Assets, Read-Write Assets'
      operationId: getFolderUsingGET
      parameters:
      - name: root
        in: query
        description: Parent folder reference
        required: false
        schema:
          type: string
      - name: maxDepth
        in: query
        description: Maximum folder depth to traverse, Default 2
        required: false
        schema:
          type: integer
          format: int32
      - name: maxReturn
        in: query
        description: Maximum number of folders to return. Default 20, maximum 200
        required: false
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        description: Integer offset for paging. Default 0
        required: false
        schema:
          type: integer
          format: int32
      - name: workSpace
        in: query
        description: Name of the workspace
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseOfFolderResponse'
    post:
      tags:
      - Folders
      summary: Create Folder
      description: 'Creates a new folder. Required Permissions: Read-Write Assets'
      operationId: createFolderUsingPOST
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseOfFolderResponse'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
        description: createFolderRequest
        required: true
components:
  schemas:
    ResponseOfFolderContentResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        requestId:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/FolderContentResponse'
        success:
          type: boolean
        warnings:
          type: array
          items:
            type: string
    FolderContentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
    ResponseOfFolderResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        requestId:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/FolderResponse'
        success:
          type: boolean
        warnings:
          type: array
          items:
            type: string
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Error code of the error. See full list of error codes <a href="https://developers.marketo.com/rest-api/error-codes/">here</a>
        message:
          type: string
          description: Message describing the cause of the error
    ResponseOfIdResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        requestId:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/IdResponse'
        success:
          type: boolean
        warnings:
          type: array
          items:
            type: string
    UpdateFolderRequest:
      type: object
      required:
      - type
      properties:
        description:
          type: string
          description: Description of the asset
        isArchive:
          type: boolean
          description: Whether the folder is archived or not. Toggling this value will change the archival status of the folder
        name:
          type: string
          description: Name of the Folder
        type:
          type: string
          description: Type of folder. 'Folder' or 'Program'
          enum:
          - Folder
          - Program
    Folder:
      type: object
      required:
      - id
      - type
      properties:
        id:
          type: integer
          format: int32
          description: Id of the folder
        type:
          type: string
          description: Type of folder
          enum:
          - Folder
          - Program
      description: JSON representation of a folder
    IdResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: integer
          format: int32
          description: Id of the asset
    FolderResponse:
      type: object
      required:
      - createdAt
      - folderId
      - folderType
      - id
      - isArchive
      - name
      - parent
      - path
      - updatedAt
      - url
      properties:
        accessZoneId:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
          description: Datetime the folder was created
        description:
          type: string
          description: Description of the folder
        folderId:
          description: Id of the folder
          $ref: '#/components/schemas/Folder'
        folderType:
          type: string
          description: Type of folder
          enum:
          - Email
          - Email Batch Program
          - Email Template
          - Image
          - Landing Page
          - Landing Page Form
          - Landing Page Template
          - Marketing Event
          - Marketing Folder
          - Marketing Program
          - Nurture Program
          - Report
          - Revenue Cycle Model
          - Zone
        id:
          type: integer
          format: int32
          description: Id of the folder
        isArchive:
          type: boolean
          description: Archival status of the folder
        isSystem:
          type: boolean
          description: Whether the folder is system-managed
        name:
          type: string
          description: Name of the folder. Not applicable for Programs
        parent:
          description: Parent folder reference
          $ref: '#/components/schemas/Folder'
        path:
          type: string
          description: Path of the folder
        updatedAt:
          type: string
          format: date-time
          description: Datetime the folder was last updated
        url:
          type: string
          description: Url of the folder
        workspace:
          type: string
          description: Name of the workspace
    CreateFolderRequest:
      type: object
      required:
      - name
      - parent
      properties:
        description:
          type: string
          description: Description of the asset
        name:
          type: string
          description: Name of the Folder
        parent:
          description: Folder object describing the parent folder
          $ref: '#/components/schemas/Folder'
