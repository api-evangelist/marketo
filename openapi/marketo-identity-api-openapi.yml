openapi: 3.2.0
info:
  description: Marketo Engage Rest API
  version: '1.0'
  title: Marketo Engage Rest Identity API
  termsOfService: https://www.adobe.com/legal.html
  contact:
    name: Adobe Developer Relations
    url: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/home
    email: ''
  license:
    name: API License Agreement
    url: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/api-license
servers:
- url: https://localhost:8080/
tags:
- name: Identity
  description: Identity Controller
paths:
  /identity/oauth/token:
    get:
      tags:
      - Identity
      summary: Identity
      description: 'Retrieve an access token from Marketo Engage. Calls to this endpoint are not counted towards API call limit.

        '
      operationId: identityUsingGET
      x-badges:
      - name: MCP
        position: before
        color: '#2D9D78'
      parameters:
      - name: client_id
        in: query
        description: Client ID from Admin > Integration > Launchpoint menu.
        required: true
        schema:
          type: string
          format: string
      - name: client_secret
        in: query
        description: Client Secret from Admin > Integration > Launchpoint menu.
        required: true
        schema:
          type: string
          format: string
      - name: grant_type
        in: query
        description: Grant type.
        required: true
        schema:
          type: string
          format: string
          enum:
          - client_credentials
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseOfIdentity'
    post:
      tags:
      - Identity
      summary: Identity
      description: 'Retrieve an access token from Marketo. Calls to this endpoint are not counted towards API call limit.

        '
      operationId: identityUsingPOST
      x-badges:
      - name: MCP
        position: before
        color: '#2D9D78'
      parameters:
      - name: client_id
        in: query
        description: Client ID from Admin > Integration > Launchpoint menu.
        required: true
        schema:
          type: string
          format: string
      - name: client_secret
        in: query
        description: Client Secret from Admin > Integration > Launchpoint menu.
        required: true
        schema:
          type: string
          format: string
      - name: grant_type
        in: query
        description: Grant type.
        required: true
        schema:
          type: string
          format: string
          enum:
          - client_credentials
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseOfIdentity'
components:
  schemas:
    ResponseOfIdentity:
      type: object
      required:
      - access_token
      - scope
      - expires_in
      - token_type
      properties:
        access_token:
          description: The token that you pass with subsequent calls to authenticate with the target instance
          type: string
        scope:
          description: The owning API-only user of the custom service that was used to authenticate
          type: string
        expires_in:
          description: Remaining lifespan of the current token in seconds
          type: integer
        token_type:
          description: The OAuth authentication method
          type: string
          enum:
          - bearer
