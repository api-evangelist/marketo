finding: >-
  Adobe ships NO Marketo Engage MCP server. Adobe's own llms.txt on the docs host
  enumerates every MCP server it operates — all of them AEM, all under
  https://mcp.adobeaemcloud.com/adobe/mcp/ — and states that a dedicated
  Experience League content MCP server "is not yet generally available". Nothing
  in the Marketo developer documentation mentions MCP. The only Marketo MCP
  server in the public registry is third-party
  (io.github.ZLeventer/marketo-mcp-server, npm marketo-mcp-server), which is a
  local stdio package by an unaffiliated author, not a provider surface. The
  tools below are therefore a DERIVED CANDIDATE set, bound to real Adobe-published
  operationIds so the crosswalk can carry real input schemas.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: oauth
  verified: derived
  note: >-
    mode:none because the provider ships neither a remote endpoint nor a stdio
    package. An agent cannot reach Marketo Engage over MCP today without building
    or trusting a third-party server.
third_party_servers:
  - name: io.github.ZLeventer/marketo-mcp-server
    registry: https://registry.modelcontextprotocol.io/v0/servers?search=marketo
    package: https://www.npmjs.com/package/marketo-mcp-server
    repository: https://github.com/ZLeventer/marketo-mcp-server
    transport: stdio
    latest_version: 1.4.0
    published: '2026-04-29'
    first_party: false
    auth: >-
      Requires MARKETO_CLIENT_ID / MARKETO_CLIENT_SECRET from a LaunchPoint
      custom service — i.e. the caller supplies their own instance credentials.
    note: >-
      Recorded for completeness ONLY. Not endorsed, not audited, and not counted
      as a Marketo agent surface.
server:
  name: marketo
  transport: null
  url: null
auth_model:
  flow: OAuth 2.0 client credentials against https://{munchkinId}.mktorest.com/identity/oauth/token
  per_tenant: true
  note: >-
    Any Marketo MCP server is inherently per-subscription: the base URL contains
    the caller's Munchkin ID, so a single hosted multi-tenant endpoint would have
    to accept the host as a parameter. This is the structural reason Marketo has
    no hosted MCP server, and it is worth stating rather than treating the
    absence as neglect.
