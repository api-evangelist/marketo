release_cadence:
  scheme: monthly named release
  current: August 2026 release
  rollout: >-
    Standard-release-cycle features begin rolling out on a stated date and phase
    in over the following weeks; feature availability varies by Marketo Engage
    edition.
  notes_url: https://experienceleague.adobe.com/en/docs/marketo/using/release-notes/current
deprecation:
  policy_url: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/rest/authentication
  sunset_header: false
  deprecation_header: false
  practice: >-
    Marketo announces breaking changes with a dated removal in the monthly
    release notes and in the affected reference page. It does NOT emit RFC 8594
    Sunset or Deprecation response headers, so a running integration receives no
    machine-readable warning — the announcement channel is prose.
  active_deprecations:
    - item: SOAP API
      status: removed
      effective: '2026-07-31'
      detail: >-
        "As of July 31st, 2026, the SOAP API is deprecated and is no longer
        available. All new development should be done with the Marketo REST API."
      source: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/rest/rest-api
      impact: >-
        Four of the community client libraries Marketo still lists, and both of
        the two libraries it labels "Official", target this retired API. See
        packages/marketo-packages.yml.
    - item: access_token query/form parameter authentication
      status: deprecated
      removal_date: '2026-08-31'
      detail: >-
        Support for passing the access token as the `access_token` query
        parameter is removed on 2026-08-31. Integrations must use the
        `Authorization: Bearer` header.
      source: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/rest/authentication
      severity: breaking
    - item: Double slash in API gateway URLs
      status: deprecated
      removal_date: null
      detail: >-
        Adobe has announced deprecation of the double slash in API gateway URLs
        via a Marketing Nation post linked from the REST API overview.
      source: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/rest/rest-api
    - item: listId parameter on Get Lead Activities / Get Lead Changes for large static lists
      status: restricted
      effective: '2026-09-30'
      detail: >-
        From 2026-09-30 these calls fail with record error 1003 when the target
        static list contains 10,000 or more leads.
      source: https://experienceleague.adobe.com/en/docs/marketo/using/release-notes/current
      severity: breaking
    - item: Merge Leads leadIds count
      status: restricted
      effective: '2026-07-31'
      detail: >-
        Calls with more than 25 IDs in leadIds now return error 1080 and are
        skipped.
      source: https://experienceleague.adobe.com/en/docs/marketo/using/release-notes/current
      severity: breaking
