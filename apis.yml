  name: Marketo Engage User Management API
  description: >-
    Administrative REST surface for managing Marketo Engage users, roles,
    workspaces and invitations — list all users, invite a user, read and assign
    roles, list workspaces, update user attributes, and delete users or pending
    invitations. 12 operations under /userservice/management/v1, published by
    Adobe as Swagger 2.0. This is the only Marketo surface whose specification
    declares real 401/403/404 responses.
  humanURL: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/rest/rest-api
