- aid: marketo:marketo-identity-api
  name: Marketo Engage Identity API
  description: >-
    The Marketo Engage token endpoint. A two-legged OAuth 2.0 client-credentials
    grant issues a bearer access token with a 3,600-second lifetime, scoped to a
    single LaunchPoint Custom Service and inheriting that service's API-Only
    user's role permissions. Support for passing the token as the access_token
    query parameter is removed on 2026-08-31; the Authorization header is the
    only supported transport thereafter.
  humanURL: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/rest/authentication
  baseURL: https://{munchkinId}.mktorest.com/identity
  tags:
  - Identity
