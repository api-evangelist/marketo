- aid: marketo:marketo-lead-database-api
  name: Marketo Engage Lead Database API
  description: >-
    The core Marketo Engage REST surface — person ("lead") records, activity and
    data-value-change feeds, companies, opportunities and opportunity roles,
    sales persons, named accounts and named account lists, custom objects and
    custom object types, custom activity types, static lists, smart campaigns,
    program members, API usage reporting, and the full bulk import/export job
    family. 147 operations under /rest/v1 and /bulk/v1, published by Adobe as
    Swagger 2.0. Field vocabularies are per-subscription and must be discovered
    at runtime through the describe operations.
  humanURL: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/rest/rest-api
