aid: marketo
name: Marketo
description: >-
  Marketo, an Adobe company, develops and sells B2B marketing automation software
  for account-based marketing, lead management, email marketing and campaign
  execution. Adobe Marketo Engage publishes five machine-readable specifications
  covering 367 REST operations across five surfaces — a Lead Database API for
  person records, activity and change feeds, companies, opportunities, custom
  objects, static lists, smart campaigns and bulk import/export; an Asset API for
  emails, landing pages, forms, templates, snippets and segments; a User
  Management API for users, roles and workspaces; an Identity endpoint issuing
  two-legged OAuth 2.0 client-credentials tokens; and an asynchronous Data
  Ingestion API on a separate Adobe-hosted domain. The base URL is
  per-subscription (https://{munchkinId}.mktorest.com), authorization is
  role-permission rather than OAuth-scope based, and most failures — including
  rate-limit and quota exhaustion — are returned inside an HTTP 200 body.
type: Index
accessModel:
  pricing: freemium
  onboarding: unknown
  trial: false
  try_now: false
  public: false
  label: Freemium
  confidence: medium
  source:
  - plans
  generated: '2026-07-22'
  method: derived
position: Consumer
access: 3rd-Party
