  - type: Overlay
    url: overlays/marketo-identity-overlay.yaml
  - type: Authentication
    url: authentication/marketo-authentication.yml
  - type: Documentation
    url: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/rest/authentication
- aid: marketo:marketo-data-ingestion-api
  name: Marketo Data Ingestion API
  description: >-
    A separate high-volume asynchronous ingestion surface hosted on Adobe's
    developer platform at mkto-ingestion-api.adobe.io rather than on the
    per-subscription Munchkin host. Seven operations sync persons, companies,
    custom objects, program member status and static list membership into a
    Marketo subscription. It is the only Marketo API published as OpenAPI 3.0.1
    and the only one that uses real HTTP status semantics — 202 Accepted for
    asynchronous acceptance, 400 for validation failure, 401 for an invalid
    OAuth token — instead of the HTTP-200 error envelope the REST APIs use.
  humanURL: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/rest/rest-api
  baseURL: https://mkto-ingestion-api.adobe.io
