format: proprietary
envelope_note: >-
  Marketo does NOT use RFC 9457 problem+json, and — critically for any agent
  calling it — Marketo returns HTTP 200 for most failures. The success/failure
  signal is the boolean `success` member of the JSON body, not the status code.
  Adobe states explicitly: "do not evaluate the HTTP reason phrase because it is
  optional and subject to change."
error_levels:
  - level: http
    signal: 4xx status code
    note: >-
      Only three HTTP-level errors occur in normal operation — 413, 414 on the
      REST endpoints and 401 on the Identity endpoint.
  - level: response
    signal: '"success": false with a populated "errors" array'
    http_status: 200
    envelope: |
      {
        "requestId": "e42b#14272d07d78",
        "success": false,
        "errors": [ { "code": "601", "message": "Unauthorized" } ]
      }
    fields:
      code: A quoted integer from 601 to 799.
      message: Plain-text reason for the error.
    semantics: >-
      A 6xx code means the entire request failed and was NOT executed. A 7xx code
      means the request failed because no data was returned or the parameters
      were invalid.
  - level: record
    signal: '"success": true with per-record "status" and a "reasons" array'
    http_status: 200
    envelope: |
      {
        "requestId": "e42b#14272d07d78",
        "success": true,
        "result": [
          { "id": 50, "status": "created" },
          { "status": "skipped", "reasons": [ { "code": "1005", "message": "Lead already exists" } ] }
        ]
      }
    semantics: >-
      Records in `result` appear in the same order as records in the request
      input array; each record succeeds or fails independently.
quota_note: >-
  Response codes at the response level do NOT count against the daily quota or
  the rate limit.
http_errors:
  - status: 413
    title: Request Entity Too Large
    detail: Payload exceeded the 1MB limit (10MB for Import Lead).
    remediation: Check request size before submission; split oversized record sets across requests.
  - status: 414
    title: Request-URI Too Long
    detail: The URI of a GET request exceeded 8KB.
    remediation: >-
      Retry as POST with `_method=GET` in the URL and the query string in the
      body. Most common when filtering on long values such as GUIDs.
  - status: 401
    title: Unauthorized
    detail: Returned by the Identity endpoint when the Client Id or Client Secret is invalid.
    remediation: Re-check the LaunchPoint Custom Service credentials.
response_errors:
  - code: '500'
    title: Internal Server error
    detail: >-
      Unexpected condition. Within Marketo this can include an improperly formed
      REST API request URL.
  - code: '502'
    title: Bad Gateway
    detail: Remote server error, likely a timeout.
    retryable: true
    remediation: Retry with exponential backoff.
  - code: '601'
    title: Access token invalid
    detail: An access token was supplied but was not a valid token.
    remediation: Re-authenticate at the Identity endpoint.
  - code: '602'
    title: Access token expired
    detail: The token has passed its 3,600-second lifetime.
    retryable: true
    remediation: Re-authenticate and resend with the new token.
  - code: '603'
    title: Access denied
    detail: >-
      Authentication succeeded but the API-Only user lacks the required Access
      API permission, or Allowlist for IP-Based API Access is enabled.
    remediation: Assign the required role permission, or allowlist the caller's IP.
  - code: '604'
    title: Request time-out
    detail: The request ran too long (e.g. database contention) or exceeded the header time-out.
    retryable: true
  - code: '605'
    title: HTTP Method not supported
    detail: e.g. GET is not supported for the Sync Leads endpoint; POST must be used.
  - code: '606'
    title: Max rate limit exceeded
    detail: More than 100 calls in the past 20 seconds.
    retryable: true
    remediation: Back off; see rate-limits/marketo-rate-limits.yml.
  - code: '607'
    title: Daily quota reached
    detail: >-
      The subscription's daily call quota was exceeded. Resets daily at 12:00AM
      CST. Quota is shown in Admin > Web Services.
  - code: '608'
    title: API Temporarily Unavailable
    retryable: true
  - code: '609'
    title: Invalid JSON
    detail: The request body is not valid JSON.
  - code: '610'
    title: Requested resource not found
    detail: The URI did not match a REST API resource type — usually a misspelled or misformatted path.
  - code: '611'
    title: System error
    detail: All unhandled exceptions.
  - code: '612'
    title: Invalid Content Type
    remediation: 'Add a content type header: application/json.'
  - code: '613'
    title: Invalid Multipart Request
    detail: The multipart content of the POST was not formatted correctly.
  - code: '614'
    title: Invalid Subscription
    detail: The destination subscription cannot be found or is unreachable — usually temporary.
    retryable: true
  - code: '615'
    title: Concurrent access limit reached
    detail: Ten requests are already in flight for this subscription.
    retryable: true
  - code: '616'
    title: Invalid subscription type
    detail: The subscription type required for the Custom Object Metadata API is not present.
  - code: '701'
    title: '%s cannot be blank'
    detail: The reported field must not be empty in the request.
  - code: '702'
    title: No data found for a given search scenario
    detail: >-
      No records matched. Note that many failed search operations instead return
      success = true, no errors, and a warnings informational string.
  - code: '703'
    title: The feature is not enabled for the subscription
    detail: A beta feature that has not been enabled for this subscription.
  - code: '704'
    title: Invalid date format
  - code: '709'
    title: Business Rule Violation
    detail: >-
      The call violates a requirement to create or update an asset — e.g. creating
      an email without a template, retrieving content for landing pages that
      contain social content, cloning a program with certain asset types, or
      approving an asset that has no draft.
  - code: '710'
    title: Parent Folder Not Found
  - code: '711'
    title: Incompatible Folder Type
  - code: '712'
    title: Merge to person Account operation is invalid
    detail: Salesforce Person Accounts must be merged in Salesforce.
  - code: '713'
    title: Transient Error
    detail: A system resource was temporarily unavailable.
    retryable: true
    remediation: Wait, then retry.
  - code: '714'
    title: Unable to find the default record type
  - code: '718'
    title: ExternalSalesPersonID not found
  - code: '719'
    title: Lock wait timeout exception
    detail: A Clone Program call timed out waiting for a lock.
    retryable: true
