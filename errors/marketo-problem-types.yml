  errors/marketo-error-codes.yml (method: searched) — this file records only what
  the machine-readable specs themselves declare, which is far less.
finding: >-
  A derived error catalog is the sharpest measure of the gap between Marketo's
  documentation and its contract. Across 361 documented operations in the five
  Adobe-published specs, only 51 declare ANY non-2xx response, and 310 declare
  none at all. The two legacy Swagger 2.0 documents that carry the bulk of the
  API — Lead Database (147 ops) and Asset (199 ops) — declare 200 OK and, in the
  Asset spec's case, an untyped `default: Error` on 33 operations. Neither models
  the 601/602/603/606/607 response-level codes that every real integration must
  handle, so an agent generated purely from the spec would treat a rate-limited
  or expired-token call as a success.
