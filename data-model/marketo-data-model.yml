note: >-
  Entity graph derived from the 175 schema definitions in the Lead Database spec
  and the Asset spec's object set, plus the id-reference fields those schemas
  carry. Marketo's data model has an unusual property worth stating first: the
  FIELD SET OF EVERY CORE ENTITY IS PER-SUBSCRIPTION AND RUNTIME-DISCOVERED. The
  Lead schema declares only id, membership, reason and status and says "may have
  any number of other fields, depending on the fields available in the target
  instance". An agent cannot know a Marketo record's shape from the spec — it
  must call a describe operation first. That is a modelling fact, not a gap.
id_conventions:
  - form: integer
    applies: [Lead, Company, Opportunity, StaticList, Campaign, Program, Activity, SalesPerson, Folder, and all Asset API objects]
    note: 32-bit or 64-bit integer surrogate keys, unique within the subscription.
  - form: GUID
    applies: [CustomObject, NamedAccount, Opportunity record, custom activity record]
    field: marketoGUID
  - form: caller-owned external key
    applies: [Company, Opportunity, SalesPerson]
    fields: [externalCompanyId, externalOpportunityId, externalSalesPersonId]
    note: >-
      The caller supplies these. They are the dedupe keys for the sync
      operations, and the closest thing this API has to an idempotency key.
  - form: sequence position
    field: seq
    note: >-
      Batch responses carry `seq` correlating each result to the position of the
      input record. Response-only; never submitted.
