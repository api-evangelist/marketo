entities:
  - name: Lead
    aka: Person
    id: id (int32)
    dynamic_fields: true
    describe: describeUsingGET_6
    note: >-
      The root entity. Always contains id; every other field is
      subscription-defined. `membership` is only populated by Get Leads By
      Program Id.
  - name: Activity
    id: id (int64)
    required: [activityDate, activityTypeId, attributes, id, leadId]
    note: >-
      Append-only event record with a typed `activityTypeId` and an `attributes`
      array of secondary values (max 20 attributes; 65,536-byte ceiling).
  - name: ActivityType
    id: id (int32)
    note: >-
      Vocabulary of activity types, extensible per subscription via the custom
      activity type operations.
  - name: ProgramMember
    required: [seq, leadId, reachedSuccess, programId, acquiredBy, membershipDate]
    note: The join entity between Lead and Program, carrying status and success.
  - name: Company
    id: id (int)
    external_key: externalCompanyId
  - name: Opportunity
    id: marketoGUID
    external_key: externalOpportunityId
  - name: OpportunityRole
    note: The join entity between Lead and Opportunity.
  - name: SalesPerson
    id: id (int64)
    external_key: externalSalesPersonId
  - name: NamedAccount
    id: marketoGUID
  - name: NamedAccountList
    note: A collection of NamedAccounts.
  - name: CustomObject
    id: marketoGUID
    dynamic_fields: true
    describe: describeCustomObjectTypeUsingGET
    note: >-
      Entirely subscription-defined. Type, fields, dedupe fields and link fields
      are all created through the API; nothing about a custom object is knowable
      from the spec.
  - name: StaticList
    id: id (int32)
    required: [createdAt, id, name, updatedAt]
  - name: Campaign
    aka: Smart Campaign
    id: id (int32)
    required: [createdAt, id, name, type, updatedAt]
    note: 'type distinguishes trigger from batch; `active` applies only to trigger campaigns.'
  - name: LeadPartition
    note: Data-isolation boundary. A lead belongs to exactly one partition.
  - name: Workspace
    note: >-
      Permission and asset boundary. A workspace has access to one or more
      partitions; role permissions are assigned per workspace.
